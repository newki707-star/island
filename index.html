<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>어스름의 섬</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="book">
    <!-- 메인 타이틀 화면 -->
    <div id="title-screen">
      <div class="title-header">
        <h1>어스름의 섬</h1>
        <p>Isle of Dusk</p>
      </div>
      <button class="primary" onclick="startGame()">시작하기</button>
    </div>

    <!-- 게임 일러스트 영역 -->
    <div id="illustration-container">
      <img id="illustration" src="" alt="Game Scene">
    </div>

    <!-- 하단 UI 영역 -->
    <div id="ui-container">
      <div class="dialog-box">
        <div id="story-text" class="dialog-text"></div>
      </div>
      <div id="choices"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
