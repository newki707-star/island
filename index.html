<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>해질녘의 섬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper-bg:#f4efe6; 
    --ink-dark:#1c1712; 
    --ink-soft:#52463b;
    --accent-brown:#6e4b2d; 
    --border-line:#d1c7b7;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;width:100%;height:100%; background:#12100e;}
  
  body{
    color:var(--ink-dark); 
    font-family:'Nanum Myeongjo', serif;
    display:flex; justify-content:center; align-items:center;
  }

  #book{
    width: 100%;
    max-width: 480px;
    height: 100vh;
    max-height: 920px;
    background: var(--paper-bg);
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: 0 0 40px rgba(0,0,0,0.7);
    overflow: hidden;
  }

  .page{
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
    background: var(--paper-bg);
  }

  /* 상단 대형 이미지 영역 (화면의 약 55~60% 차지) */
  .illust-frame{ 
    width: 100%; 
    height: 55vh;
    max-height: 480px;
    position: relative;
    background: #000;
    overflow: hidden;
    flex-shrink: 0;
  }

  .illust-frame img{ 
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
    display: block;
  }

  .frame-placeholder{
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #fff;
    font-size: 14px;
    letter-spacing: 0.1em;
    background: #2a241e;
  }

  /* 하단 컨텐츠 영역 (텍스트 및 선택지) */
  .content-area {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 24px 24px 20px 24px;
    overflow-y: auto;
  }

  .text-box {
    margin-bottom: 20px;
    cursor: pointer;
  }

  .scene-text{
    font-size: 16px;
    line-height: 1.8;
    color: var(--ink-dark);
    white-space: pre-line;
    word-break: keep-all;
  }
  
  .scene-text .thought{
    display: block;
    font-style: italic;
    font-size: 15px;
    color: var(--accent-brown);
    margin: 8px 0;
    padding-left: 10px;
    border-left: 2px solid var(--accent-brown);
  }
  
  .scene-text .note-text{
    display: block;
    font-size: 14.5px;
    color: #2c241c;
    background: rgba(0,0,0,0.03);
    padding: 12px 14px;
    border-radius: 4px;
    margin: 8px 0;
    border: 1px solid var(--border-line);
    line-height: 1.6;
  }

  .next-hint {
    font-size: 12px;
    color: var(--accent-brown);
    margin-top: 8px;
    letter-spacing: 0.1em;
    opacity: 0.8;
  }

  /* 선택지 스타일 (이미지 아래에 깔끔하게 배치) */
  .choices{ 
    display: flex; 
    flex-direction: column; 
    gap: 10px; 
    margin-top: auto;
    padding-bottom: 10px;
  }

  button.choice{
    font-family: 'Nanum Myeongjo', serif;
    font-size: 15px;
    font-weight: 700;
    text-align: center;
    background: transparent;
    color: var(--ink-dark);
    border: none;
    padding: 12px 16px;
    cursor: pointer;
    transition: all 0.2s ease;
    line-height: 1.5;
    word-break: keep-all;
    border-bottom: 1px solid var(--border-line);
  }

  button.choice:last-child {
    border-bottom: none;
  }

  button.choice:active, button.choice:hover{
    color: var(--accent-brown);
    background: rgba(110, 75, 45, 0.05);
  }

  button.primary{
    font-family: 'Nanum Myeongjo', serif;
    font-weight: 800;
    font-size: 16px;
    background: var(--ink-dark);
    color: var(--paper-bg);
    border: none;
    border-radius: 4px;
    padding: 14px 28px;
    cursor: pointer;
    margin: 20px auto 0 auto;
    display: block;
    letter-spacing: 0.05em;
  }

  .title-container {
    text-align: center;
    margin: auto 0;
  }

  .eyebrow{ 
    font-size: 12px; 
    letter-spacing: 0.3em; 
    text-transform: uppercase; 
    color: var(--accent-brown); 
    margin-bottom: 12px; 
  }
  
  h1.title{ 
    font-weight: 800; 
    font-size: 32px; 
    line-height: 1.3; 
    margin: 0 0 16px 0; 
    color: var(--ink-dark); 
  }
  
  .subtitle{ 
    font-size: 15.5px; 
    color: var(--ink-soft); 
    line-height: 1.8; 
    margin: 0; 
    word-break: keep-all; 
  }

  .stamp{
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.2em;
    color: var(--accent-brown);
    margin-bottom: 6px;
  }
  
  .ending-title{ 
    font-weight: 800; 
    font-size: 24px; 
    text-align: center; 
    margin: 0 0 16px 0; 
    color: var(--ink-dark); 
  }

  .fade-in{ animation: fadeIn 0.35s ease both; display: flex; flex-direction: column; height: 100%; }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }

  footer{ text-align:center; font-size:10px; color:var(--ink-soft); padding:6px 0; opacity:0.6; }
</style>
</head>
<body>

<div id="book">
  <div class="page" id="panel"></div>
</div>

<script>
const IMAGES = {
  bg: "bg.png",
  title_bg: "title_bg.png",
  attic: "attic.png",
  beach: "beach.png",
  boat: "boat.png",
  cave: "cave.png",
  desk: "desk.png",
  fog: "fog.png",
  hall_clock: "hall_clock.png",
  house: "house.png",
  lighthouse: "lighthouse.png",
  shadow: "shadow.png",
  stars: "stars.png"
};

function renderFrame(key, label){
  const src = IMAGES[key];
  if(src && src.trim() !== ""){
    return `<div class="illust-frame"><img src="${src}" alt="${label}"></div>`;
  }
  return `
    <div class="illust-frame">
      <div class="frame-placeholder">
        🎨 <strong>${label}</strong>
      </div>
    </div>
  `;
}

let state = { memory: [] };

const T = (s) => `<span class="thought">${s}</span>`;
const N = (s) => `<span class="note-text">${s}</span>`;

function hasMemory(k){ return state.memory.includes(k); }
function addMemory(k){ if(!hasMemory(k)) state.memory.push(k); }

const scenes = {
  title: { render: () => `
      ${renderFrame('bg', '시작 화면')}
      <div class="content-area">
        <div class="title-container">
          <div class="eyebrow">Interactive Fiction</div>
          <h1 class="title">해질녘의 섬</h1>
          <p class="subtitle">지친 일상을 뒤로하고 바다로 나선 어느 날,<br>시간이 정지해 버린 안개 섬에 도착했다.</p>
        </div>
        <button class="primary" onclick="restartGame()">이야기 시작하기</button>
        <footer>해질녘의 섬</footer>
      </div>
  `},

  p1: { frame:["boat", "배"], text:()=>`반복되는 일상과 끝없는 서류 작업.
모든 것에 지쳐 무작정 작은 배를 빌려 바다로 나왔다.`, next:"p2" },
  
  p2: { frame:["boat", "배"], text:()=>`차가운 바람이 얼굴을 스쳤다.
얼마 만에 느껴보는 한적함인지 몰랐다.`, next:"p3" },

  p3: { frame:["fog", "안개"], text:()=>`얼마나 나아갔을까.
사방에서 짙은 우윳빛 안개가 순식간에 밀려왔다.`, next:"p4" },

  p4: { frame:["fog", "안개"], text:()=>`나침반 바늘은 방향을 잃고 뱅글뱅글 돌기만 했고, 
엔진 소리만 무겁게 울렸다.`, next:"p5" },

  p5: { frame:["beach", "해변"], text:()=>`둔탁한 마찰음과 함께 배가 작은 모래사장에 박혔다.
당황스럽기보단, 오랫동안 원했던 휴식처럼 느껴졌다.`, next:"p6" },

  p6: { frame:["beach", "해변"], text:()=>`"안개가 걷힐 때까지만... 쉬었다 가자."

가방에서 책을 꺼내 들고 모래사장에 앉았다.`, next:"p7" },

  p7: { frame:["shadow", "그림자"], text:()=>`한참 동안 책을 읽고 시계를 보았다.
손목시계의 초침은 째깍거리며 2시간이 지났음을 알리고 있었다.`, next:"p8" },

  p8: { frame:["shadow", "그림자"], text:()=>`하지만 하늘의 노을은 여전히 주황색이었다.
조금도 어두워지지 않았다.`, next:"p9" },

  p9: { frame:["shadow", "그림자"], text:()=>`이상해서 모래사장 위에 세워둔 나뭇가지 그림자를 관찰했다.
단 1밀리미터도 움직이지 않았다.

${T("시간이... 전혀 흐르지 않고 있다.")}`, next:"p10" },

  p10: { frame:["boat", "배"], text:()=>`황급히 배로 돌아와 시동을 걸어보았다.
하지만 배는 마치 모래톱에 굳어버린 것처럼 미동조차 하지 않았다.`, next:"p11" },

  p11: { frame:["beach", "해변"], text:()=>`밀물도 썰물도 없었다.
파도 소리조차 들리지 않는 이상한 정적.

나는 섬 위쪽으로 발걸음을 옮기기 시작했다.`, next:"beach_choice" },

  beach_choice: { frame:["house", "저택"],
    text: (s)=>`언덕 위로 낡은 2층 목조 저택이 보인다.
그리고 그 앞에는 누군가 떨어뜨리고 간 듯한 낡은 가방이 파묻혀 있다.`,
    choices:(s)=>{
      const opts = [];
      if(!hasMemory("북두칠성_방향")){
        opts.push({label:"모래사장에 파묻힌 낡은 가방을 열어본다", next:"find_bag"});
      }
      opts.push({label:"시간을 지체할 수 없으니 언덕 위 저택으로 바로 올라간다", next:"house_front"});
      return opts;
    }
  },

  find_bag: { frame:["beach", "해변"],
    text: (s)=>`가방 안에서 어떤 어부의 항해 기록장을 발견했다.

${N("...이 섬 주변의 암초 지형은 기묘하다. 북쪽 절벽의 거친 암초는 오직 '북두칠성이 가리키는 수로'로만 빠져나갈 수 있다. 그렇지 않으면 배가 박살난다...")}

${T("북두칠성 방향... 기억해 두자.")}`,
    next:"house_front",
    action: ()=>addMemory("북두칠성_방향")
  },

  house_front: { frame:["house", "저택"],
    text: (s)=>`저택 입구의 우체통 안에 메모장이 있다.`,
    next:"house_diary"
  },

  house_diary: { frame:["house", "저택"],
    text: (s)=>`${N("...매일 오후 3시쯤 서재로 들어간다. 이상하게 서재로 들어설 때마다 거실의 커다란 괘종시계가 울리곤 했다. 시계는 서재와 무언가 연결되어 있는 느낌이다...")}

${T("오후 3시... 그리고 서재.")}`,
    next:"hall",
    action: ()=>addMemory("3시_서재")
  },

  hall: { frame:["hall_clock", "로비"],
    text: (s)=>`저택은 적막하다. 
중앙에는 거대한 괘종시계가 서 있고, 계단과 복도가 여러 갈래로 나뉘어 있다.`,
    choices:(s)=>{
      const opts = [
        {label:"1층 서재 문을 열고 들어간다", next:"study"},
        {label:"2층 침실 방향으로 올라간다", next:"bedroom"}
      ];

      if(hasMemory("서재_방문") || hasMemory("침실_방문")){
        opts.push({label:"2층 구석의 먼지 쌓인 다락방 계단으로 향한다", next:"attic"});
      }

      if(hasMemory("3시_서재")){
        opts.push({label:"괘종시계 바늘을 '오후 3시'로 돌린다", next:"clock_success"});
      } else {
        opts.push({label:"괘종시계 바늘을 정각 '12시'로 돌려본다", next:"clock_trap"});
      }

      return opts;
    }
  },

  clock_trap: { frame:["hall_clock", "쾌종시계"],
    text: (s)=>`태엽을 돌리자 둔탁한 소리와 함께 시계 내부 스프링이 경고음처럼 튕겨 나왔다!
먼지가 자욱하게 날리며 시계 바늘이 뻑뻑하게 고장 나 버렸다.

${T("어디선가 정확한 정보를 찾아야 해...")}`,
    next:"hall"
  },

  study: { frame:["desk", "서재"],
    text: (s)=>`오래된 책상 위. 
항해 도면과 서류들이 흩어져 있고, 한쪽에 다이얼 잠금 상자가 놓여 있다.`,
    next:"study_detail",
    action: ()=>addMemory("서재_방문")
  },

  study_detail: { frame:["desk", "서재"],
    text: (s)=>`${N("...등대의 강력한 빛이라도 그냥 쏘면 안개에 반사되어 무용지물이 된다. 반드시 '북동쪽 절벽의 반사판'을 향해 조준해야 안개가 사라진다...")}

${T("북동쪽 절벽...")}`,
    next:"study_choice",
    action: ()=>addMemory("북동쪽_절벽")
  },

  study_choice: { frame:["desk", "서재"],
    text: (s)=>`책상 위에 굳게 잠긴 상자가 보인다.`,
    choices:(s)=>{
      const opts = [];
      if(!hasMemory("렌즈_조각")){
        opts.push({label:"다이얼을 '3-8-5'로 조합해 맞춘다", next:"study_box_open"});
        opts.push({label:"다이얼을 '3-8-8'로 조합해 맞춘다", next:"study_box_fail"});
      } else {
        opts.push({label:"열린 상자 내부를 살펴본다", next:"study_box_empty"});
      }
      opts.push({label:"로비로 돌아간다", next:"hall"});
      return opts;
    }
  },

  study_box_empty: { frame:["desk", "서재"],
    text: (s)=>`상자에는 아주 미세한 안개 억제 기술 관련 도면이 남아있다.`, next:"hall" },

  study_box_fail: { frame:["desk", "서재"],
    text: (s)=>`철컥... 다이얼을 맞췄지만 잠금장치는 미동도 하지 않는다.
${T("숫자가 틀린 것 같다.")}`,
    next:"hall"
  },

  study_box_open: { frame:["desk", "서재"],
    text: (s)=>`탁! 상자가 열리며 정밀하게 세공된 **'특수 강화 렌즈'**를 획득했다!`,
    next:"hall",
    action: ()=>addMemory("렌즈_조각")
  },

  bedroom: { frame:["house", "침실"],
    text: (s)=>`2층 침실. 
탁자 위에 주파수 조율에 관한 관찰 메모가 남겨져 있다.`,
    next:"bedroom_detail",
    action: ()=>addMemory("침실_방문")
  },

  bedroom_detail: { frame:["house", "침실"],
    text: (s)=>`${N("...여기 안개 입자는 특정 주파수에 반응한다. 등대 제어기를 '88.5MHz'로 맞추었을 때 안개가 흩어지는 현상을 관찰했다...")}

${T("주파수 88.5MHz...")}`,
    next:"hall",
    action: ()=>addMemory("주파수_885")
  },

  attic: { frame:["attic", "다락방"],
    text: (s)=>`거미줄이 친 다락방 창가. 
수평선 너머 정지한 상현달을 향해 고정된 망원경과 태엽 오르골이 놓여 있다.`,
    choices:[
      {label:"망원경 옆 노트의 기록을 자세히 읽어본다", next:"attic_detail"},
      {label:"탁자 위 태엽 오르골을 끝까지 감아 작동시킨다", next:"attic_trap"},
      {label:"로비로 돌아내려간다", next:"hall"}
    ]
  },

  attic_trap: { frame:["attic", "다락방"],
    text: (s)=>`이형의 오르골 소리가 기괴하게 다락방에 퍼진다...
순간 극심한 이명과 환각이 밀려오며 머리가 지끈거린다!

${T("으윽... 만지지 말았어야 했어!")}`,
    next:"hall"
  },

  attic_detail: { frame:["attic", "다락방"],
    text: (s)=>`${N("...파도가 잔잔해지는 날에는 왠지 '최고급 파란색 금장' 망원경으로 보고 싶다. 주로 '2단계'로 설정해놓는다...")}

${T("파란색 금장 망원경...2단계")}`,
    next:"hall",
    action: ()=>addMemory("렌즈_초점_3단계")
  },

  clock_success: { frame:["hall_clock", "괘종시계"],
    text: (s)=>`시계 바늘을 '오후 3시'에 맞추자, 둔탁한 소리와 함께 시계 뒤편의 벽면이 열리며 지하 비밀통로가 나타났다!`,
    next:"secret_path"
  },

  secret_path: { frame:["house", "비밀통로"],
    text: (s)=>`비밀통로는 두 갈래로 갈라진다. 위쪽은 등대로, 아래쪽은 지하 포구 동굴로 연결된다.`,
    choices:[
      {label:"섬 정상의 등대로 올라간다", next:"lighthouse"},
      {label:"어두운 지하 포구 동굴로 내려간다", next:"cave"}
    ]
  },

  lighthouse: { frame:["title_bg", "등대"],
    text: (s)=>`등대 제어실. 거대한 거울과 복잡한 조작 레버들이 먼지를 뒤덮은 채 서 있다.`,
    choices:(s)=>{
      const opts = [
        {label:"등대 제어반 조작부를 살펴본다", next:"lighthouse_engine"}
      ];

      if(hasMemory("주파수_885")){

    text:(s)=>`뗏목이 암초에 부딪혀 부서졌다.
다행히 헤엄쳐 돌아왔지만, 탈출할 다른 방법을 찾아야 한다.`},

  ending_stay:{ frame:["shadow", "엔딩 D"], badge:"엔딩 D · 안식", title:"시간이 멈춘 방",
    text:(s)=>`피곤했던 세상 대신 해가 지지 않는 이 정적 속에 머물기로 했다.

function computeEnding(choice){
  if(choice === 'true_light') return 'ending_true_light';
  if(choice === 'normal_light') return 'ending_normal_light';
  if(choice === 'true_escape') return 'ending_true_escape';
  if(choice === 'risk_escape') return 'ending_risk_escape';
  return 'ending_stay';
}

function restartGame(){
  state = { memory: [] };
  go('p1');
}

let currentChoices = [];

function choose(index){
  const c = currentChoices[index];
  if(!c) return;

  if(c.action) c.action();

  if(c.next === 'ENDCALC'){
    renderEnding(computeEnding(c.value));
  } else {
    go(c.next);
  }
}

function go(sceneId){
  const panel = document.getElementById('panel');
  const scene = scenes[sceneId];
  if(!scene) return;

  if(scene.action) scene.action();

  const frameHtml = scene.frame ? renderFrame(scene.frame[0], scene.frame[1]) : "";
  const text = typeof scene.text === 'function' ? scene.text(state) : scene.text;

  if(scene.next){
    const isEndingCalc = scene.next === 'ENDCALC';
    const nextClickAction = isEndingCalc 
      ? `renderEnding(computeEnding('${scene.value}'))` 
      : `go('${scene.next}')`;

    panel.innerHTML = `
      <div class="fade-in">
        ${frameHtml}
        <div class="content-area">
          <div class="text-box" onclick="${nextClickAction}">
            <div class="scene-text">${text}</div>
            <div class="next-hint">▼</div>
          </div>
          <div></div>
          <footer>해질녘의 섬</footer>
        </div>
      </div>
    `;
    return;
  }

  const choiceList = typeof scene.choices === 'function' ? scene.choices(state) : scene.choices;
  currentChoices = choiceList;

  const choicesHtml = choiceList.map((c,i) =>
    `<button class="choice" onclick="choose(${i})">${c.label}</button>`
  ).join('');

  panel.innerHTML = `
    <div class="fade-in">
      ${frameHtml}
      <div class="content-area">
        <div class="text-box" style="cursor:default;">
          <div class="scene-text">${text}</div>
        </div>
        <div class="choices">${choicesHtml}</div>
        <footer>해질녘의 섬</footer>
      </div>
    </div>
  `;
}

function renderEnding(endId){
  const panel = document.getElementById('panel');
  const e = endings[endId];
  const frameHtml = e.frame ? renderFrame(e.frame[0], e.frame[1]) : "";
  const text = typeof e.text === 'function' ? e.text(state) : e.text;

  panel.innerHTML = `
    <div class="fade-in">
      ${frameHtml}
      <div class="content-area">
        <div>
          <div class="stamp">${e.badge}</div>
          <h1 class="ending-title">${e.title}</h1>
        </div>
        <div class="text-box" style="cursor:default;">
          <div class="scene-text">${text}</div>
        </div>
        <button class="primary" onclick="restartGame()">처음부터 다시 시작</button>
        <footer>해질녘의 섬</footer>
      </div>
    </div>
  `;
}

document.addEventListener("DOMContentLoaded", () => {
  const panel = document.getElementById('panel');
  panel.innerHTML = `<div class="fade-in">${scenes.title.render()}</div>`;
});
</script>
