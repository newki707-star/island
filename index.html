<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>해질녘의 섬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper-bg:#e8dfcf; 
    --paper-card:#f2e9dc;
    --ink-dark:#1c1712; 
    --ink-soft:#423930;
    --accent-brown:#6e4b2d; 
    --border-line:#a3927d;
    --gold-accent:#9e753b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;width:100%;height:100%; background:#0e0c0a;}
  
  body{
    color:var(--ink-dark); 
    font-family:'Nanum Myeongjo', serif;
    display:flex; justify-content:center; align-items:center;
    padding:0; margin:0;
  }

  #book{
    width: 100%;
    max-width: 420px;
    height: 100vh;
    max-height: 860px;
    background: var(--paper-bg);
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: 0 0 30px rgba(0,0,0,0.8);
    overflow: hidden;
  }

  .page{
    width: 100%;
    height: 100%;
    padding: 16px 16px 12px 16px;
    background: 
      radial-gradient(circle at center, rgba(255,255,255,0.3) 0%, rgba(0,0,0,0.08) 100%),
      linear-gradient(180deg, var(--paper-card), var(--paper-bg));
    border: 10px solid #231c15;
    outline: 2px solid #524332;
    outline-offset: -6px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
  }

  .status-bar{
    display:flex; justify-content:space-between; font-size:11px; color:var(--ink-soft);
    border-bottom:1px double var(--border-line); padding-bottom:4px; margin-bottom:8px;
  }

  .eyebrow{ font-size:11px; letter-spacing:0.25em; text-transform:uppercase; color:var(--accent-brown); text-align:center; margin-bottom:6px; }
  h1.title{ font-weight:800; font-size:28px; line-height:1.3; text-align:center; margin:10px 0; color:var(--ink-dark); }
  .subtitle{ font-size:15px; color:var(--ink-soft); line-height:1.7; text-align:center; margin:0 0 20px 0; word-break:keep-all; }

  .illust-frame{ 
    width: 100%; 
    height: 340px; 
    margin: 0 auto 10px auto; 
    position: relative;
    background: rgba(0, 0, 0, 0.04);
    border: 1px solid var(--border-line);
    outline: 1px solid var(--border-line);
    outline-offset: -5px;
    display: flex; 
    flex-direction: column;
    justify-content: center; 
    align-items: center; 
    overflow: hidden;
    flex-shrink: 0;
  }

  .illust-frame::before, .illust-frame::after {
    content: "✦";
    position: absolute;
    font-size: 10px;
    color: var(--accent-brown);
    opacity: 0.6;
    z-index: 2;
  }
  .illust-frame::before { top: 7px; left: 8px; }
  .illust-frame::after { bottom: 7px; right: 8px; }

  .frame-placeholder{
    font-size: 13px;
    color: var(--accent-brown);
    letter-spacing: 0.1em;
    text-align: center;
    opacity: 0.8;
    line-height: 1.6;
  }

  .illust-frame img{ 
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
    display: block;
    position: absolute;
    top: 0; left: 0;
  }

  .dialog-box{
    position: relative;
    background: rgba(255, 255, 255, 0.55);
    border: 1px solid var(--border-line);
    padding: 12px 14px 22px 14px;
    min-height: 115px;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
  }

  .dialog-box:active{
    background: rgba(255, 255, 255, 0.75);
  }

  .scene-text{
    font-size:14.5px; line-height:1.7; color:var(--ink-dark);
    white-space:pre-line; word-break:keep-all;
  }
  .scene-text .thought{
    display:block; font-style:italic; font-size:13.5px; color:var(--accent-brown);
    margin:4px 0; padding-left:8px; border-left:2px solid var(--accent-brown);
  }
  .scene-text .note-text{
    display:block; font-size:13px; color:#2c241c; background:rgba(0,0,0,0.04);
    padding:8px 10px; border-radius:2px; margin:4px 0; border:1px solid var(--border-line); line-height:1.5;
  }

  .next-indicator{
    position: absolute;
    right: 12px;
    bottom: 6px;
    font-size: 11px;
    color: var(--accent-brown);
    animation: blinkTriangle 0.8s infinite alternate ease-in-out;
  }

  @keyframes blinkTriangle{
    from { transform: translateY(0); opacity: 0.3; }
    to { transform: translateY(3px); opacity: 1; }
  }

  .choices{ display:flex; flex-direction:column; gap:6px; margin-top:6px; }
  button.choice{
    font-family:'Nanum Myeongjo', serif; font-size:13.5px; font-weight:700; text-align:left;
    background:rgba(255,255,255,0.65); color:var(--ink-dark); border:1px solid var(--border-line);
    border-left:4px solid var(--gold-accent); padding:9px 10px; cursor:pointer;
    transition:all 0.15s ease; line-height:1.35;
  }
  button.choice:active{ background:rgba(255,255,255,0.9); border-left-color:var(--accent-brown); }

  button.primary{
    font-family:'Nanum Myeongjo', serif; font-weight:800; font-size:16px; background:var(--ink-dark); color:var(--paper-bg);
    border:1px solid var(--gold-accent); padding:12px 28px; cursor:pointer; margin: 10px auto 0 auto; display:block;
  }

  .stamp{
    text-align:center; font-size:12px; font-weight:700; letter-spacing:0.2em;
    color:var(--accent-brown); border:1px solid var(--accent-brown); padding:3px 8px; margin:0 auto 8px auto; width:max-content;
  }
  .ending-title{ font-weight:800; font-size:20px; text-align:center; margin:0 0 8px 0; color:var(--ink-dark); }

  .fade-in{ animation:fadeIn 0.3s ease both; display:flex; flex-direction:column; height:100%; justify-content:space-between; }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }

  footer{ text-align:center; font-size:9.5px; color:var(--ink-soft); padding:2px 0; margin-top:4px; border-top:1px solid rgba(0,0,0,0.08); }
</style>
</head>
<body>

<div id="book">
  <div class="page" id="panel"></div>
</div>

<script>
const IMAGES = {
  bg: "bg.png",
  title_bg: "title_bg.png",
  attic: "attic.png",
  beach: "beach.png",
  boat: "boat.png",
  cave: "cave.png",
  desk: "desk.png",
  fog: "fog.png",
  hall_clock: "hall_clock.png",
  house: "house.png",
  lighthouse: "lighthouse.png",
  shadow: "shadow.png",
  stars: "stars.png"
};

function renderFrame(key, label){
  const src = IMAGES[key];
  if(src && src.trim() !== ""){
    return `<div class="illust-frame"><img src="${src}" alt="${label}"></div>`;
  }
  return `
    <div class="illust-frame">
      <div class="frame-placeholder">
        🎨 <strong>${label}</strong><br>
        <span style="font-size:11px; opacity:0.75;">[ 세로 확장 프레임 ]</span>
      </div>
    </div>
  `;
}

let state = { memory: [] };

const T = (s) => `<span class="thought">${s}</span>`;
const N = (s) => `<span class="note-text">${s}</span>`;

function hasMemory(k){ return state.memory.includes(k); }
function addMemory(k){ if(!hasMemory(k)) state.memory.push(k); }

const scenes = {
  title: { render: () => `
      ${renderFrame('bg', '시작 화면')}
      <div style="margin:auto 0;">
        <div class="eyebrow">Interactive Fiction</div>
        <h1 class="title">해질녘의 섬</h1>
        <p class="subtitle">지친 일상을 뒤로하고 바다로 나선 어느 날,<br>시간이 정지해 버린 안개 섬에 도착했다.</p>
      </div>
      <button class="primary" onclick="restartGame()">이야기 시작하기</button>
  `},

  p1: { frame:["boat", "배"], text:()=>`반복되는 일상과 끝없는 서류 작업.
모든 것에 지쳐 무작정 작은 배를 빌려 바다로 나왔다.`, next:"p2" },
  
  p2: { frame:["boat", "배"], text:()=>`차가운 바람이 얼굴을 스쳤다.
얼마 만에 느껴보는 한적함인지 몰랐다.`, next:"p3" },

  p3: { frame:["fog", "안개"], text:()=>`얼마나 나아갔을까.
사방에서 짙은 우윳빛 안개가 순식간에 밀려왔다.`, next:"p4" },

  p4: { frame:["fog", "안개"], text:()=>`나침반 바늘은 방향을 잃고 뱅글뱅글 돌기만 했고, 
엔진 소리만 무겁게 울렸다.`, next:"p5" },

  p5: { frame:["beach", "해변"], text:()=>`둔탁한 마찰음과 함께 배가 작은 모래사장에 얹혀 섰다.
당황스럽기보단, 오랫동안 원했던 휴식처럼 느껴졌다.`, next:"p6" },

  p6: { frame:["beach", "해변"], text:()=>`"안개가 걷힐 때까지만... 쉬었다 가자."

가방에서 책을 꺼내 들고 모래사장에 앉았다.`, next:"p7" },

  p7: { frame:["shadow", "그림자"], text:()=>`한참 동안 책을 읽고 시계를 보았다.
손목시계의 초침은 째깍거리며 4시간이 지났음을 알리고 있었다.`, next:"p8" },

  p8: { frame:["shadow", "그림자"], text:()=>`하지만 하늘의 노을은 여전히 주황색이었다.
조금도 어두워지지 않았다.`, next:"p9" },

  p9: { frame:["shadow", "그림자"], text:()=>`이상해서 모래사장 위에 그어놓은 내 나뭇가지 그림자를 관찰했다.
단 1밀리미터도 움직이지 않았다.

${T("시간이... 전혀 흐르지 않고 있다.")}`, next:"p10" },

  p10: { frame:["boat", "배"], text:()=>`황급히 배로 돌아와 시동을 걸어보았다.
하지만 배는 마치 모래톱에 굳어버린 것처럼 미동조차 하지 않았다.`, next:"p11" },

  p11: { frame:["beach", "해변"], text:()=>`밀물도 썰물도 없었다.
파도 소리조차 들리지 않는 이상한 정적.

나는 섬 위쪽으로 발걸음을 옮기기 시작했다.`, next:"beach_choice" },

  beach_choice: { frame:["house", "저택"],
    text: (s)=>`언덕 위로 낡은 2층 목조 저택이 보인다.
해변 구석 모래사장에는 누군가 버리고 간 듯한 낡은 가방이 파묻혀 있다.`,
    choices:(s)=>{
      const opts = [];
      if(!hasMemory("북두칠성_방향")){
        opts.push({label:"모래사장에 파묻힌 낡은 가방을 열어본다", next:"find_bag"});
      }
      opts.push({label:"언덕 위 목조 저택으로 바로 올라간다", next:"house_front"});
      return opts;
    }
  },

  find_bag: { frame:["beach", "해변"],
    text: (s)=>`가방 안에서 축축하게 젖은 옛 어부의 항해 기록장을 발견했다.

${N("...이 섬 주변의 암초 지형은 기묘하다. 북쪽 절벽의 거친 암초는 오직 '북두칠성이 가리키는 수로'로만 빠져나갈 수 있다. 그렇지 않으면 배가 박살난다...")}

${T("북두칠성 방향... 기억해 두자.")}`,
    next:"house_front",
    action: ()=>addMemory("북두칠성_방향")
  },

  house_front: { frame:["house", "저택"],
    text: (s)=>`저택 입구의 우체통 안에 주인의 일기장이 꽂혀 있다.`,
    next:"house_diary"
  },

  house_diary: { frame:["house", "저택"],
    text: (s)=>`${N("...나는 매일 오후 3시만 되면 차를 들고 서재로 들어간다. 서재로 들어설 때마다 거실의 커다란 쾌종시계가 울리곤 했다. 그 시계는 서재와 무언가 연결되어 있는 느낌이다...")}

${T("오후 3시... 그리고 서재.")}`,
    next:"hall",
    action: ()=>addMemory("3시_서재")
  },

  hall: { frame:["hall_clock", "로비"],
    text: (s)=>`저택 로비는 정적 속에 싸여 있다. 
중앙에는 거대한 쾌종시계가 서 있고, 계단과 복도가 여러 갈래로 나뉘어 있다.`,
    choices:(s)=>{
      const opts = [
        {label:"1층 서재 문을 열고 들어간다", next:"study"},
        {label:"2층 침실 방향으로 올라간다", next:"bedroom"}
      ];

      if(hasMemory("서재_방문") || hasMemory("침실_방문")){
        opts.push({label:"2층 구석의 먼지 쌓인 다락방 계단으로 향한다", next:"attic"});
      }

      if(hasMemory("3시_서재")){
        opts.push({label:"쾌종시계 바늘을 '오후 3시'로 돌린다", next:"clock_success"});
      } else {
        opts.push({label:"쾌종시계 바늘을 정각 '12시'로 돌려본다", next:"clock_trap"});
      }

      return opts;
    }
  },

  clock_trap: { frame:["hall_clock", "쾌종시계"],
    text: (s)=>`태엽을 돌리자 둔탁한 소리와 함께 시계 내부 스프링이 경고음처럼 튕겨 나왔다!
먼지가 자욱하게 날리며 시계 바늘이 뻑뻑하게 고장 나 버렸다.

${T("어디선가 정확한 시각 힌트를 찾아야 해...")}`,
    next:"hall"
  },

  study: { frame:["desk", "서재"],
    text: (s)=>`오래된 책상 위. 
항해 도면과 서류들이 흩어져 있고, 한쪽에 다이얼 잠금 상자가 놓여 있다.`,
    next:"study_detail",
    action: ()=>addMemory("서재_방문")
  },

  study_detail: { frame:["desk", "서재"],
    text: (s)=>`${N("...등대의 강력한 빛이라도 그냥 쏘면 안개에 반사되어 무용지물이 된다. 반드시 '북동쪽 절벽의 반사판'을 향해 조준해야 안개 파동이 깨진다...")}

${T("북동쪽 절벽...")}`,
    next:"study_choice",
    action: ()=>addMemory("북동쪽_절벽")
  },

  study_choice: { frame:["desk", "서재"],
    text: (s)=>`책상 위의 놋쇠 잠금 상자가 보인다.`,
    choices:(s)=>{
      const opts = [];
      if(!hasMemory("렌즈_조각")){
        opts.push({label:"다이얼을 '3-8-5'로 조합해 맞춘다", next:"study_box_open"});
        opts.push({label:"다이얼을 '3-8-8'로 조합해 맞춘다", next:"study_box_fail"});
      } else {
        opts.push({label:"이미 열려있는 놋쇠 상자 내부를 살펴본다", next:"study_box_empty"});
      }
      opts.push({label:"로비로 돌아간다", next:"hall"});
      return opts;
    }
  },

  study_box_empty: { frame:["desk", "서재"],
    text: (s)=>`상자는 이미 비어있다. 모서리에 아주 미세한 안개 억제 집광 기술 관련 도면이 남아있다.`, next:"hall" },

  study_box_fail: { frame:["desk", "서재"],
    text: (s)=>`철컥... 다이얼을 맞췄지만 잠금장치는 미동도 하지 않는다.
${T("조합 숫자가 틀린 것 같다.")}`,
    next:"hall"
  },

  study_box_open: { frame:["desk", "서재"],
    text: (s)=>`탁! 상자가 열리며 정밀하게 세공된 **'집광 강화 필터 렌즈'**를 획득했다!`,
    next:"hall",
    action: ()=>addMemory("렌즈_조각")
  },

  bedroom: { frame:["house", "침실"],
    text: (s)=>`2층 침실. 
탁자 위에 주파수 조율에 관한 관찰 메모가 남겨져 있다.`,
    next:"bedroom_detail",
    action: ()=>addMemory("침실_방문")
  },

  bedroom_detail: { frame:["house", "침실"],
    text: (s)=>`${N("...안개 입자는 특정 주파수에 공명하여 흔들린다. 등대 음향 제어기를 '88.5MHz'로 맞추었을 때 안개가 흩어지는 현상을 관찰했다...")}

${T("주파수 88.5MHz...")}`,
    next:"hall",
    action: ()=>addMemory("주파수_885")
  },

  attic: { frame:["attic", "다락방"],
    text: (s)=>`거미줄이 친 다락방 창가. 
수평선 너머 정지한 상현달을 향해 고정된 망원경과 태엽 오르골이 놓여 있다.`,
    choices:[
      {label:"망원경 옆 노트의 기록을 자세히 읽어본다", next:"attic_detail"},
      {label:"탁자 위 태엽 오르골을 끝까지 감아 작동시킨다", next:"attic_trap"},
      {label:"로비로 돌아내려간다", next:"hall"}
    ]
  },

  attic_trap: { frame:["attic", "다락방"],
    text: (s)=>`이형의 오르골 소리가 기괴하게 다락방에 퍼진다...
순간 극심한 이명과 환각이 밀려오며 머리가 지끈거린다!

${T("으윽... 만지지 말았어야 했어!")}`,
    next:"hall"
  },

  attic_detail: { frame:["attic", "다락방"],
    text: (s)=>`${N("...상현달이 뜨는 날에는 망원경의 광학 초점을 '3단계'로 밀어 넣을 때 비로소 거울 공명 파동이 최고조에 달한다...")}

${T("초점 3단계... 등대에서 유용하겠어.")}`,
    next:"hall",
    action: ()=>addMemory("렌즈_초점_3단계")
  },

  clock_success: { frame:["hall_clock", "쾌종시계"],
    text: (s)=>`시계 바늘을 '오후 3시'에 맞추자, 둔탁한 소리와 함께 시계 뒤편의 벽면이 열리며 지하 비밀통로가 나타났다!`,
    next:"secret_path"
  },

  secret_path: { frame:["house", "비밀통로"],

const endings = {

멈춰있던 저택의 시계가 다시 째깍거리기 시작했고, 당신은 섬을 벗어나 진짜 당신의 삶으로 돌아왔다.`},

  ending_risk_escape:{ frame:["beach", "엔딩 C"], badge:"엔딩 C · 난파", title:"어두운 바다",
    text:(s)=>`뗏목이 암초에 부딪혀 부서졌다.
다행히 헤엄쳐 돌아왔지만, 탈출할 다른 방법을 찾아야 한다.`},

  ending_stay:{ frame:["shadow", "엔딩 D"], badge:"엔딩 D · 안식", title:"시간이 멈춘 방",
    text:(s)=>`피곤했던 세상 대신 해가 지지 않는 이 정적 속에 머물기로 했다.

function computeEnding(choice){
  if(choice === 'true_light') return 'ending_true_light';
  if(choice === 'normal_light') return 'ending_normal_light';
  if(choice === 'true_escape') return 'ending_true_escape';
  if(choice === 'risk_escape') return 'ending_risk_escape';
  return 'ending_stay';
}

function statusHtml(){
  return `<div class="status-bar">
    <span>🧭 단서 단계: <strong>${state.memory.length}개 발견</strong></span>
    <span>해질녘의 섬</span>
  </div>`;
}

function footerHtml(){
  return `<footer>― 📜 화면 또는 대사창을 터치하여 진행하세요 ―</footer>`;
}

function restartGame(){
  state = { memory: [] };
  go('p1');
}

let currentChoices = [];

function choose(index){
  const c = currentChoices[index];
  if(!c) return;

  if(c.action) c.action();

  if(c.next === 'ENDCALC'){
    renderEnding(computeEnding(c.value));
  } else {
    go(c.next);
  }
}

function go(sceneId){
  const panel = document.getElementById('panel');
  const scene = scenes[sceneId];
  if(!scene) return;

  if(scene.action) scene.action();

  const frameHtml = scene.frame ? renderFrame(scene.frame[0], scene.frame[1]) : "";
  const text = typeof scene.text === 'function' ? scene.text(state) : scene.text;

  if(scene.next){
    const isEndingCalc = scene.next === 'ENDCALC';
    const nextClickAction = isEndingCalc 
      ? `renderEnding(computeEnding('${scene.value}'))` 
      : `go('${scene.next}')`;

    panel.innerHTML = `
      <div class="fade-in">
        ${statusHtml()}
        ${frameHtml}
        <div class="dialog-box" onclick="${nextClickAction}">
          <div class="scene-text">${text}</div>
          <div class="next-indicator">▼</div>
        </div>
        ${footerHtml()}
      </div>
    `;
    return;
  }

  const choiceList = typeof scene.choices === 'function' ? scene.choices(state) : scene.choices;
  currentChoices = choiceList;

  const choicesHtml = choiceList.map((c,i) =>
    `<button class="choice" onclick="choose(${i})">
      <span>${c.label}</span>
    </button>`
  ).join('');

  panel.innerHTML = `
    <div class="fade-in">
      ${statusHtml()}
      ${frameHtml}
      <div style="flex-grow:1; display:flex; flex-direction:column; justify-content:space-between;">
        <div class="dialog-box" style="min-height:75px; flex-grow:0; cursor:default;">
          <div class="scene-text">${text}</div>
        </div>
        <div class="choices">${choicesHtml}</div>
      </div>
      ${footerHtml()}
    </div>
  `;
}

function renderEnding(endId){
  const panel = document.getElementById('panel');
  const e = endings[endId];
  const frameHtml = e.frame ? renderFrame(e.frame[0], e.frame[1]) : "";
  const text = typeof e.text === 'function' ? e.text(state) : e.text;

  panel.innerHTML = `
    <div class="fade-in">
      <div>
        <div class="stamp">${e.badge}</div>
        <h1 class="ending-title">${e.title}</h1>
      </div>
      ${frameHtml}
      <div class="dialog-box" style="cursor:default;">
        <div class="scene-text">${text}</div>
      </div>
      <button class="primary" onclick="restartGame()">처음부터 다시 시작</button>
      ${footerHtml()}
    </div>
  `;
}

document.addEventListener("DOMContentLoaded", () => {
  const panel = document.getElementById('panel');
  panel.innerHTML = `<div class="fade-in">${scenes.title.render()}${footerHtml()}</div>`;
});
</script>
