<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>해질녘의 섬 - 컴팩트 에디션</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper-bg:#f4efe6; 
    --ink-dark:#1c1712; 
    --ink-soft:#52463b;
    --accent-brown:#6e4b2d; 
    --border-line:#d1c7b7;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;width:100%;height:100%; background:#12100e; overflow:hidden;}
  
  body{
    color:var(--ink-dark); 
    font-family:'Nanum Gothic', sans-serif !important;
    display:flex; justify-content:center; align-items:center;
  }

  #book{
    width: 100%;
    max-width: 480px;
    height: 100%;
    max-height: 840px;
    background: var(--paper-bg);
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: 0 0 40px rgba(0,0,0,0.7);
    overflow: hidden;
  }

  /* 상단 고정 오디오 컨트롤 바 */
  .audio-bar {
    position: absolute;
    top: 6px;
    right: 8px;
    z-index: 100;
    display: flex;
    align-items: center;
    background: rgba(28, 23, 18, 0.75);
    padding: 3px 8px;
    border-radius: 20px;
    backdrop-filter: blur(4px);
  }

  .audio-bar button {
    background: none;
    border: none;
    color: #f4efe6;
    font-size: 12px;
    font-family: 'Nanum Gothic', sans-serif;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 2px;
  }

  .page{
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
    background: var(--paper-bg);
    overflow: hidden;
  }

  /* 이미지가 양옆 검은 여백 없이 꽉 차도록 설정 */
  .illust-frame{ 
    width: 100%; 
    height: 56vh;
    min-height: 280px;
    max-height: 450px;
    position: relative;
    background: #1a1612;
    overflow: hidden;
    flex-shrink: 0;
  }

  .illust-frame img{ 
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
    display: block;
  }

  .frame-placeholder{
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #fff;
    font-size: 14px;
    background: #2a241e;
  }

  /* 컨텐츠 영역: 텍스트 칸의 공간을 줄이고 여백 압축 */
  .content-area {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 8px 14px 10px 14px;
    overflow: hidden;
  }

  .text-box {
    cursor: pointer;
    position: relative;
    padding-bottom: 12px;
    overflow: hidden;
    min-height: 50px;
  }

  /* 텍스트 크기 대폭 확대 및 나눔고딕 명시 */
  .scene-text{
    font-family: 'Nanum Gothic', sans-serif !important;
    font-size: 17.5px;
    font-weight: 700;
    line-height: 1.5;
    color: var(--ink-dark);
    white-space: pre-line;
    word-break: keep-all;
  }
  
  .scene-text .thought{
    display: block;
    font-family: 'Nanum Gothic', sans-serif !important;
    font-style: italic;
    font-size: 16px;
    font-weight: 700;
    color: var(--accent-brown);
    margin: 2px 0;
    padding-left: 6px;
    border-left: 2px solid var(--accent-brown);
  }
  
  .scene-text .note-text{
    display: block;
    font-family: 'Nanum Gothic', sans-serif !important;
    font-size: 16px;
    font-weight: 700;
    color: #2c241c;
    background: rgba(0,0,0,0.03);
    padding: 4px 7px;
    border-radius: 4px;
    margin: 2px 0;
    border: 1px solid var(--border-line);
    line-height: 1.4;
  }

  .next-hint {
    position: absolute;
    right: 0;
    bottom: 0;
    font-size: 14px;
    color: var(--accent-brown);
    animation: blink 1.2s infinite ease-in-out;
  }

  @keyframes blink {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
  }

  .choices{ 
    display: flex; 
    flex-direction: column; 
    gap: 5px; 
    margin-top: 6px;
    flex-shrink: 0;
  }

  /* 선택지 텍스트 크기 확대 및 나눔고딕 명시 */
  button.choice{
    font-family: 'Nanum Gothic', sans-serif !important;
    font-size: 16px;
    font-weight: 800;
    text-align: left;
    background: transparent;
    color: var(--ink-dark);
    border: none;
    padding: 6px 4px;
    cursor: pointer;
    transition: all 0.2s ease;
    line-height: 1.35;
    word-break: keep-all;
    border-bottom: 1px solid var(--border-line);
  }

  button.choice:last-child {
    border-bottom: none;
  }

  button.choice:active, button.choice:hover{
    color: var(--accent-brown);
    background: rgba(110, 75, 45, 0.05);
  }

  button.choice.hidden-unlocked {
    color: var(--accent-brown);
    background: rgba(110, 75, 45, 0.08);
  }

  button.primary{
    font-family: 'Nanum Gothic', sans-serif !important;
    font-weight: 800;
    font-size: 16px;
    background: var(--ink-dark);
    color: var(--paper-bg);
    border: none;
    border-radius: 4px;
    padding: 8px 18px;
    cursor: pointer;
    margin: 6px auto 0 auto;
    display: block;
    letter-spacing: 0.05em;
  }

  .title-container {
    text-align: center;
    margin: auto 0;
  }

  .eyebrow{ 
    font-family: 'Nanum Gothic', sans-serif !important;
    font-size: 12px; 
    letter-spacing: 0.2em; 
    text-transform: uppercase; 
    color: var(--accent-brown); 
    margin-bottom: 6px; 
  }
  
  h1.title{ 
    font-family: 'Nanum Gothic', sans-serif !important;
    font-weight: 800; 
    font-size: 28px; 
    line-height: 1.2; 
    margin: 0 0 10px 0; 
    color: var(--ink-dark); 
  }
  
  .subtitle{ 
    font-family: 'Nanum Gothic', sans-serif !important;
    font-size: 16px; 
    font-weight: 700;
    color: var(--ink-soft); 
    line-height: 1.5; 
    margin: 0; 
    word-break: keep-all; 
  }

  .stamp{
    text-align: center;
    font-family: 'Nanum Gothic', sans-serif !important;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.15em;
    color: var(--accent-brown);
    margin-bottom: 4px;
  }
  
  .ending-title{ 
    font-family: 'Nanum Gothic', sans-serif !important;
    font-weight: 800; 
    font-size: 22px; 
    text-align: center; 
    margin: 0 0 8px 0; 
    color: var(--ink-dark); 
  }

  .fade-in{ animation: fadeIn 0.3s ease both; display: flex; flex-direction: column; height: 100%; width: 100%; }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }

  footer{ text-align:center; font-family: 'Nanum Gothic', sans-serif !important; font-size:9.5px; color:var(--ink-soft); padding:2px 0; opacity:0.6; flex-shrink: 0; margin-top: auto; }
</style>
</head>
<body>

<div id="book">
  <div class="audio-bar" id="audioBar" style="display:none;">
    <button onclick="toggleAudio()" id="audioBtn">🔇 BGM</button>
  </div>
  <div class="page" id="panel"></div>
</div>

<script>
let audioCtx = null;
let isAudioPlaying = false;
let ambientInterval = null;
let masterGain = null;

function initAudio() {
  if (audioCtx) return;
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AudioContext();

  masterGain = audioCtx.createGain();
  masterGain.gain.setValueAtTime(0.25, audioCtx.currentTime);
  masterGain.connect(audioCtx.destination);
}

function startDarkAmbient() {
  if (isAudioPlaying) return;
  initAudio();
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  isAudioPlaying = true;
  updateAudioButtonUI();

  playDroneOscillator(55, 0.15);
  playDroneOscillator(82.41, 0.08);

  ambientInterval = setInterval(() => {
    if (!isAudioPlaying) return;
    playAtmosphericNote();
  }, 4500);
}

function stopDarkAmbient() {
  isAudioPlaying = false;
  if (ambientInterval) {
    clearInterval(ambientInterval);
    ambientInterval = null;
  }
  if (audioCtx) {
    audioCtx.close();
    audioCtx = null;
  }
  updateAudioButtonUI();
}

function toggleAudio() {
  if (isAudioPlaying) {
    stopDarkAmbient();
  } else {
    startDarkAmbient();
  }
}

function updateAudioButtonUI() {
  const btn = document.getElementById('audioBtn');
  if (btn) {
    btn.innerHTML = isAudioPlaying ? "🔊 BGM" : "🔇 BGM";
  }
}

function playDroneOscillator(freq, volume) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

  const lfo = audioCtx.createOscillator();
  const lfoGain = audioCtx.createGain();
  lfo.frequency.setValueAtTime(0.2, audioCtx.currentTime);
  lfoGain.gain.setValueAtTime(1.5, audioCtx.currentTime);
  lfo.connect(osc.frequency);
  lfo.start();

  gain.gain.setValueAtTime(0, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(volume, audioCtx.currentTime + 3);

  osc.connect(gain);
  gain.connect(masterGain);
  osc.start();
}

function playAtmosphericNote() {
  if (!audioCtx || !isAudioPlaying) return;
  const notes = [220, 261.63, 293.66, 329.63, 392, 440, 523.25];
  const chosenFreq = notes[Math.floor(Math.random() * notes.length)];

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = Math.random() > 0.5 ? 'sine' : 'sawtooth';
  osc.frequency.setValueAtTime(chosenFreq, audioCtx.currentTime);

  const now = audioCtx.currentTime;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.04, now + 1.2);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 5.0);

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(600, now);

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);

  osc.start(now);
  osc.stop(now + 5.2);
}

const IMAGES = {
  bg: "bg.png",
  title_bg: "title_bg.png",
  attic: "attic.png",
  beach: "beach.png",
  boat: "boat.png",
  cave: "cave.png",
  desk: "desk.png",
  fog: "fog.png",
  hall_clock: "hall_clock.png",
  house: "house.png",
  lighthouse: "lighthouse.png",
  shadow: "shadow.png",
  stars: "stars.png"
};

function renderFrame(key, label){
  const src = IMAGES[key];
  if(src && src.trim() !== ""){
    return `<div class="illust-frame"><img src="${src}" alt="${label}"></div>`;
  }
  return `
    <div class="illust-frame">
      <div class="frame-placeholder">
        <strong>${label}</strong>
      </div>
    </div>
  `;
}

let state = { memory: [] };

const T = (s) => `<span class="thought">${s}</span>`;
const N = (s) => `<span class="note-text">${s}</span>`;

function hasMemory(k){ return state.memory.includes(k); }
function addMemory(k){ if(!hasMemory(k)) state.memory.push(k); }

const scenes = {
  title: { render: () => `
      ${renderFrame('bg', '시작 화면')}
      <div class="content-area">
        <div class="title-container">
          <div class="eyebrow">Interactive Fiction</div>
          <h1 class="title">해질녘의 섬</h1>
          <p class="subtitle">지친 일상을 뒤로하고 바다로 나선 어느 날,<br>시간이 정지해 버린 안개 섬에 도착했다.</p>
        </div>
        <button class="primary" onclick="startGameAudio()">이야기 시작하기</button>
        <footer>해질녘의 섬</footer>
      </div>
  `},

  p1: { frame:["boat", "배"], text:()=>`반복되는 일상과 끝없는 서류 작업. 모든 것에 지쳐 무작정 작은 배를 빌려 바다로 나왔다.`, next:"p2" },
  p2: { frame:["boat", "배"], text:()=>`차가운 바람이 얼굴을 스쳤다. 얼마 만에 느껴보는 한적함인지 몰랐다.`, next:"p3" },
  p3: { frame:["fog", "안개"], text:()=>`얼마나 나아갔을까. 사방에서 짙은 우윳빛 안개가 순식간에 밀려왔다.`, next:"p4" },
  p4: { frame:["fog", "안개"], text:()=>`나침반 바늘은 방향을 잃고 뱅글뱅글 돌기만 했고, 엔진 소리만 무겁게 울렸다.`, next:"p5" },
  p5: { frame:["beach", "해변"], text:()=>`둔탁한 마찰음과 함께 배가 작은 모래사장에 박혔다. 당황스럽기보단, 오랫동안 원했던 휴식처럼 느껴졌다.`, next:"p6" },
  p6: { frame:["beach", "해변"], text:()=>`"안개가 걷힐 때까지만... 쉬었다 가자." 가방에서 책을 꺼내 들고 모래사장에 앉았다.`, next:"p7" },
  p7: { frame:["shadow", "그림자"], text:()=>`한참 동안 책을 읽고 시계를 보았다. 손목시계의 초침은 2시간이 지났음을 알리고 있었다.`, next:"p8" },
  p8: { frame:["shadow", "그림자"], text:()=>`하지만 하늘의 노을은 여전히 주황색이었다. 조금도 어두워지지 않았다.`, next:"p9" },
  p9: { frame:["shadow", "그림자"], text:()=>`이상해서 나뭇가지 그림자를 관찰했다. 단 1밀리미터도 움직이지 않았다.\n${T("시간이... 전혀 흐르지 않고 있다.")}`, next:"p10" },
  p10: { frame:["boat", "배"], text:()=>`황급히 배로 돌아와 시동을 걸었으나, 배는 모래톱에 굳어버린 것처럼 미동조차 하지 않았다.`, next:"p11" },
  p11: { frame:["beach", "해변"], text:()=>`밀물도 썰물도 없었다. 파도 소리조차 들리지 않는 이상한 정적. 섬 위쪽으로 발걸음을 옮긴다.`, next:"beach_choice" },

  beach_choice: { frame:["house", "저택"],
    text: (s)=>`언덕 위로 낡은 2층 목조 저택이 보인다. 그 앞에는 누군가 떨어뜨리고 간 듯한 낡은 가방이 있다.`,
    choices:(s)=>{
      const opts = [];
      if(!hasMemory("북두칠성_방향")){
        opts.push({label:"모래사장에 파묻힌 낡은 가방을 열어본다", next:"find_bag"});
      }
      opts.push({label:"시간을 지체할 수 없으니 언덕 위 저택으로 바로 올라간다", next:"house_front"});
      return opts;
    }
  },

  find_bag: { frame:["beach", "해변"],
    text: (s)=>`가방 안에서 어부의 항해 기록장을 발견했다.\n${N("...북쪽 절벽의 암초는 오직 '북두칠성이 가리키는 수로'로만 빠져나갈 수 있다...")}\n${T("북두칠성 방향... 기억해 두자.")}`,
    next:"house_front",
    action: ()=>addMemory("북두칠성_방향")
  },

  house_front: { frame:["house", "저택"],
    text: (s)=>`저택 입구의 우체통 안에 메모장이 있다.`,
    next:"house_diary"
  },

  house_diary: { frame:["house", "저택"],
    text: (s)=>`${N("...매일 오후 3시쯤 서재로 들어간다. 서재로 들어설 때마다 괘종시계가 울리곤 했다...")}\n${T("오후 3시... 그리고 서재.")}`,
    next:"hall",

      if(hasMemory("서재_방문") || hasMemory("침실_방문")){

      }

      if(hasMemory("서재_방문")){
        opts.push({label:"괘종시계 바늘을 '오후 3시'로 돌린다", next:"clock_success"});
      } else {
        opts.push({label:"괘종시계 바늘을 정각 '12시'로 돌려본다", next:"clock_trap"});
      }

      if(hasMemory("서재_방문") && hasMemory("침실_방문") && hasMemory("다락방_방문")){
        opts.push({label:"[조사] 로비 바닥의 숨겨진 열쇠 구멍을 살펴본다", next:"secret_hall_hint", isHiddenUnlocked: true});
      }

      return opts;
    }
  },

  secret_hall_hint: { frame:["hall_clock", "로비"],
    text: (s)=>`바닥을 살펴보자, 패널에 숨겨진 작은 열쇠 구멍이 나타났다!\n${T("비밀 통로뿐만 아니라 이 안에도 무언가 숨겨져 있었어...")}`,
    next:"hall",
    action: ()=>addMemory("비밀_열쇠구멍_발견")
  },

  clock_trap: { frame:["hall_clock", "괘종시계"],
    text: (s)=>`태엽을 돌리자 둔탁한 소리와 함께 시계 내부 스프링이 고장 나 버렸다.\n${T("단서가 부족해...")}`,
    next:"hall"
  },

  study: { frame:["desk", "서재"],
    text: (s)=>`오래된 책상 위. 항해 도면과 서류들이 흩어져 있고 다이얼 상자가 놓여 있다.`,
    next:"study_choice",
    action: ()=>addMemory("서재_방문")
  },

  study_choice: { frame:["desk", "서재"],
    text: (s)=>`책상 위에 굳게 잠긴 상자가 보인다.`,
    choices:(s)=>{
      const opts = [];
      if(!hasMemory("렌즈_조각")){
        if(hasMemory("암초_수로_파악")){
          opts.push({label:"다이얼을 올바른 번호 '3-8-5'로 맞춘다", next:"study_box_open"});
          opts.push({label:"다이얼을 다른 번호로 맞춰본다", next:"study_box_fail"});
        } else {
          opts.push({label:"다이얼 잠금장치를 살펴본다 (비밀번호를 찾아야 한다)", next:"study_box_hint_thought"});
        }
      } else {
        opts.push({label:"열린 상자 내부를 살펴본다", next:"study_box_empty"});
      }
      opts.push({label:"로비로 돌아간다", next:"hall"});
      return opts;
    }
  },

  study_box_hint_thought: { frame:["desk", "서재"],
    text: (s)=>`3자리의 다이얼 잠금장치가 견고하게 채워져 있다.\n${T("지하 포구 등에 힌트가 숨겨져 있을지도 몰라.")}`,
    next:"study_choice"
  },

  ending_true_light:{ frame:["title_bg", "엔딩 S"], badge:"엔딩 S · 진실 해방", title:"다시 흐르는 시간", text:()=>`멈춰있던 저택의 시계가 다시 움직이며 현실로 돌아왔다.`},
  ending_normal_light:{ frame:[ "title_bg", "엔딩 B"], badge:"엔딩 B · 구조", title:"안개 속의 불빛", text:()=>`등대 불빛을 본 어선 덕분에 무사히 집으로 돌아왔다.`},
  ending_true_escape:{ frame:["stars", "엔딩 A"], badge:"엔딩 A · 생환", title:"북두칠성의 길", text:()=>`북두칠성 수로를 따라 안전하게 바다로 탈출했다.`},
  ending_risk_escape:{ frame:["beach", "엔딩 C"], badge:"엔딩 C · 난파", title:"어두운 바다", text:()=>`뗏목이 부서져 난파당했다. 다시 방법을 찾아야 한다.`}
};

function computeEnding(choice){
  if(choice === 'true_secret') return 'ending_true_secret';
  if(choice === 'true_light') return 'ending_true_light';
  if(choice === 'normal_light') return 'ending_normal_light';
  if(choice === 'true_escape') return 'ending_true_escape';
  return 'ending_risk_escape';
}

function startGameAudio(){
  startDarkAmbient();
  document.getElementById('audioBar').style.display = 'flex';
  go('p1');
}

function restartGame(){
  state = { memory: [] };
  go('p1');
}

let currentChoices = [];

function choose(index){
  const c = currentChoices[index];
  if(!c) return;
  if(c.action) c.action();

  if(c.next === 'ENDCALC'){
    renderEnding(computeEnding(c.value));
  } else {
    go(c.next);
  }
}

function go(sceneId){
  const panel = document.getElementById('panel');
  const scene = scenes[sceneId];
  if(!scene) return;

  if(scene.action) scene.action();

  const frameHtml = scene.frame ? renderFrame(scene.frame[0], scene.frame[1]) : "";
  const text = typeof scene.text === 'function' ? scene.text(state) : scene.text;

  if(scene.next){
    const isEndingCalc = scene.next === 'ENDCALC';
    const nextClickAction = isEndingCalc 
      ? `renderEnding(computeEnding('${scene.value}'))` 
      : `go('${scene.next}')`;

    panel.innerHTML = `
      <div class="fade-in">
        ${frameHtml}
        <div class="content-area">
          <div class="text-box" onclick="${nextClickAction}">
            <div class="scene-text">${text}</div>
            <div class="next-hint">▼</div>
          </div>
          <footer>해질녘의 섬</footer>
        </div>
      </div>
    `;
    return;
  }

  const choiceList = typeof scene.choices === 'function' ? scene.choices(state) : scene.choices;
  currentChoices = choiceList;

  const choicesHtml = choiceList.map((c,i) => {
    const extraClass = c.isHiddenUnlocked ? ' choice hidden-unlocked' : 'choice';
    return `<button class="${extraClass}" onclick="choose(${i})">${c.label}</button>`;
  }).join('');

  panel.innerHTML = `
    <div class="fade-in">
      ${frameHtml}
      <div class="content-area">
        <div class="text-box" style="cursor:default;">
          <div class="scene-text">${text}</div>
        </div>
        <div class="choices">${choicesHtml}</div>
        <footer>해질녘의 섬</footer>
      </div>
    </div>
  `;
}

function renderEnding(endId){
  const panel = document.getElementById('panel');
  const e = endings[endId];
  const frameHtml = e.frame ? renderFrame(e.frame[0], e.frame[1]) : "";
  const text = typeof e.text === 'function' ? e.text(state) : e.text;

  panel.innerHTML = `
    <div class="fade-in">
      ${frameHtml}
      <div class="content-area">
        <div>
          <div class="stamp">${e.badge}</div>
          <h1 class="ending-title">${e.title}</h1>
        </div>
        <div class="text-box" style="cursor:default;">
          <div class="scene-text">${text}</div>
        </div>
        <button class="primary" onclick="restartGame()">처음부터 다시 시작</button>
        <footer>해질녘의 섬</footer>
      </div>
    </div>
  `;
}

document.addEventListener("DOMContentLoaded", () => {
  const panel = document.getElementById('panel');
  panel.innerHTML = `<div class="fade-in">${scenes.title.render()}</div>`;
});
</script>
